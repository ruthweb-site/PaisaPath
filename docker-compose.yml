services:
  paisapath-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paisapath-ai
    restart: unless-stopped
    ports:
      - "8000:8000"   # React Frontend + FastAPI Backend
      - "8501:8501"   # Streamlit Dashboard
    env_file:
      - .env
    environment:
      - APP_MODE=both # Runs both interfaces simultaneously
      - PORT=8000
    volumes:
      - paisapath-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  paisapath-data:

